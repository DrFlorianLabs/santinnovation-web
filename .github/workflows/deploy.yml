name: Qualité locale et CI (aucun déploiement)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm --prefix cms ci
      - run: npm --prefix cms run init
      - run: npm --prefix cms run seed:demo
      - run: npm --prefix cms run check
      - run: npm --prefix cms test -- --http
      - run: npm --prefix cms run build
      - run: npm run check
      - run: npm run test:unit
      - run: npm run publish:local
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm audit --audit-level=moderate
      - run: npm --prefix cms audit --audit-level=moderate
